<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="feltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hintergrund-Abrundung -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>

  <!-- Filzkreis in der Mitte -->
  <circle cx="256" cy="240" r="170" fill="url(#feltGrad)" filter="url(#dropShadow)"/>
  <circle cx="256" cy="240" r="166" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Krone oben -->
  <path d="M206 140 L226 175 L256 130 L286 175 L306 140 L300 195 L212 195 Z" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
  <circle cx="206" cy="138" r="6" fill="#fef08a"/>
  <circle cx="256" cy="128" r="7" fill="#fef08a"/>
  <circle cx="306" cy="138" r="6" fill="#fef08a"/>

  <!-- Linke Karte (Pik-Dame Mit') -->
  <g transform="translate(195, 255) rotate(-14)">
    <rect x="-55" y="-80" width="110" height="160" rx="10" fill="#ffffff" filter="url(#dropShadow)"/>
    <rect x="-51" y="-76" width="102" height="152" rx="8" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Pik-Symbol & Q -->
    <text x="-40" y="-50" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#0f172a">Q</text>
    <path d="M-30 -42 C-38 -32 -42 -22 -30 -14 C-24 -9 -28 0 -30 4 L-26 4 C-28 0 -32 -9 -26 -14 C-14 -22 -18 -32 -26 -42 Z" transform="translate(26, 4) scale(1.6)" fill="#0f172a"/>
    <text x="0" y="25" text-anchor="middle" font-size="54" fill="#0f172a">♠</text>
  </g>

  <!-- Rechte Karte (Herz-Ass) -->
  <g transform="translate(315, 260) rotate(14)">
    <rect x="-55" y="-80" width="110" height="160" rx="10" fill="#ffffff" filter="url(#dropShadow)"/>
    <rect x="-51" y="-76" width="102" height="152" rx="8" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Herz-Symbol & A -->
    <text x="-40" y="-50" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#dc2626">A</text>
    <text x="0" y="25" text-anchor="middle" font-size="54" fill="#dc2626">♥</text>
  </g>

  <!-- Schriftzug KUJONG unten -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="6" fill="url(#goldGrad)" filter="url(#dropShadow)">KUJONG</text>
</svg>
